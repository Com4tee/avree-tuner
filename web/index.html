<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVREE · Universal Remote</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg stroke='%235586b0' stroke-width='3'%3E%3Cline x1='3' y1='5' x2='37' y2='5'/%3E%3Cline x1='3' y1='12' x2='37' y2='12'/%3E%3Cline x1='3' y1='19' x2='37' y2='19'/%3E%3Cline x1='3' y1='28' x2='37' y2='28'/%3E%3Cline x1='3' y1='35' x2='37' y2='35'/%3E%3C/g%3E%3Crect x='12' y='19.5' width='16' height='6' fill='%235586b0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="root">
    <div class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <g stroke="#5586b0" stroke-width="3">
            <line x1="3" y1="5"  x2="37" y2="5"/>
            <line x1="3" y1="12" x2="37" y2="12"/>
            <line x1="3" y1="19" x2="37" y2="19"/>
            <line x1="3" y1="28" x2="37" y2="28"/>
            <line x1="3" y1="35" x2="37" y2="35"/>
          </g>
          <rect x="12" y="19.5" width="16" height="6" fill="#5586b0"/>
        </svg>
        <b>AVREE</b><span>UNIVERSAL REMOTE</span>
      </div>
      <div class="sep"></div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="dot" id="conn-dot"></span>
        <span class="mono" style="font-size:12px" id="conn-host">—</span>
        <span class="dim" style="font-size:12px" id="conn-note">łączę…</span>
      </div>
      <div class="chip" id="device-chip" hidden></div>
      <div class="grow"></div>
      <button class="btn" id="btn-power" data-tip-key="power">Wyłącz strefę</button>
      <button class="btn" id="btn-standby" data-tip-key="power">Uśpij</button>
      <button class="btn" id="btn-refresh">Odśwież stan</button>
    </div>

    <div class="body">
      <nav class="rail">
        <div class="group">STEROWANIE</div>
        <button data-tab="pulpit" class="active">Pulpit</button>
        <button data-tab="odtwarzanie">Odtwarzanie</button>
        <button data-tab="audyssey">Audyssey</button>
        <button data-tab="glosniki">Głośniki</button>
        <button data-tab="dzwiek">Dźwięk i pilot</button>
        <button data-tab="equalizer">Equalizer</button>
        <button data-tab="konfiguracja">Konfiguracja</button>
        <div class="group">KALIBRACJA</div>
        <button data-tab="pomiar">Pomiar</button>
        <button data-tab="projektor">Rzutnik i TV</button>
        <div class="group">DOM</div>
        <button data-tab="inne">Inne urządzenia</button>
        <div class="group">NARZĘDZIA</div>
        <button data-tab="konsola">Konsola protokołu</button>
      </nav>

      <main class="content" id="view"></main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
