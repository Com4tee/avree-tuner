<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="AVREE — Universal Remote">
  <title>AVREE — Universal Remote</title>
  <style>
    .wm { fill: #2b2b2b; }
    .tag { fill: #8f8f83; }
    @media (prefers-color-scheme: dark) {
      .wm { fill: #e8e8e6; }
      .tag { fill: #9a9a8e; }
    }
  </style>
  <!-- motyw suwaków / racka: poziome paski i jedna wypełniona nakładka (fader cap) -->
  <g stroke="#5586b0" stroke-width="5">
    <line x1="14" y1="26"  x2="230" y2="26"/>
    <line x1="14" y1="52"  x2="230" y2="52"/>
    <line x1="14" y1="78"  x2="230" y2="78"/>
    <line x1="14" y1="104" x2="230" y2="104"/>
    <line x1="14" y1="130" x2="230" y2="130"/>
    <line x1="14" y1="170" x2="230" y2="170"/>
    <line x1="14" y1="196" x2="230" y2="196"/>
    <line x1="14" y1="222" x2="230" y2="222"/>
    <line x1="14" y1="248" x2="230" y2="248"/>
    <line x1="14" y1="274" x2="230" y2="274"/>
  </g>
  <rect x="70" y="132" width="88" height="36" fill="#5586b0"/>

  <text class="wm" x="270" y="178" font-family="'Space Grotesk','Arial Black',system-ui,sans-serif"
        font-size="150" font-weight="700" letter-spacing="6">AVREE</text>

  <rect x="272" y="206" width="392" height="14" fill="#5586b0"/>

  <text class="tag" x="274" y="262" font-family="'Space Grotesk',system-ui,sans-serif"
        font-size="29" font-weight="500" letter-spacing="15">UNIVERSAL REMOTE</text>
</svg>
